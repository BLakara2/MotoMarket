openapi: 3.0.3
info:
  title: MotoMarket API
  description: |
    API REST pour la marketplace MotoMarket - Vente et achat de motos, pièces détachées et accessoires.
    
    ## Authentification
    La plupart des routes nécessitent un token JWT dans le header `Authorization: Bearer <token>`.
    
    ## Pagination
    Les listes retournent un objet paginé avec `data`, `page`, `limit`, `total`, `totalPages`.
    
    ## Upload Photos
    Utiliser `multipart/form-data` pour les uploads. Formats acceptés: JPG, JPEG, PNG, WebP.
    Taille max configurable côté serveur.
    
    ## Types d'annonces
    - **MOTORCYCLE** : Motos complètes
    - **PART** : Pièces détachées (freins, moteurs, pneus...)
    - **ACCESSORY** : Accessoires (casques, blousons, gants...)
  version: 1.0.0
  contact:
    name: MotoMarket
  license:
    name: MIT

servers:
  - url: http://localhost:5000/api
    description: Développement local
  - url: https://api.motomarket.mg/api
    description: Production

tags:
  - name: Auth
    description: Inscription, connexion, token
  - name: Listings
    description: CRUD annonces (motos, pièces, accessoires)
  - name: Favorites
    description: Gestion des favoris
  - name: Users
    description: Profils utilisateurs
  - name: Conversations
    description: Messagerie entre acheteur et vendeur
  - name: Reviews
    description: Évaluations vendeurs
  - name: Reports
    description: Signalements
  - name: Payments
    description: Paiements et abonnements
  - name: Admin
    description: Routes d'administration

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Enums ──
    UserRole:
      type: string
      enum: [USER, PRO, ADMIN]

    ListingType:
      type: string
      enum: [MOTORCYCLE, PART, ACCESSORY]
      description: "Type d'annonce : MOTORCYCLE (moto), PART (pièce détachée), ACCESSORY (accessoire)"

    ListingStatus:
      type: string
      enum: [DRAFT, PENDING_REVIEW, ACTIVE, SOLD, PAUSED, EXPIRED, REJECTED, DELETED]

    MotorcycleCategory:
      type: string
      enum: [CROSS, ROUTE, ROADSTER, SCOOTER, TRAIL, CUSTOM, AUTRE]
      description: "Catégorie de moto (uniquement pour les annonces de type MOTORCYCLE)"

    FuelType:
      type: string
      enum: [ESSENCE, DIELECTRIQUE, HYBRIDE, ELECTRIQUE]

    TransmissionType:
      type: string
      enum: [MANUELLE, AUTOMATIQUE, SEMI_AUTO]

    ConditionType:
      type: string
      enum: [NEUF, TRES_BON, BON, USAGE, A_REFORMER]

    SellerType:
      type: string
      enum: [INDIVIDUAL, PROFESSIONAL]

    VerificationStatus:
      type: string
      enum: [NOT_REQUESTED, PENDING, VERIFIED, REJECTED]

    ReportReason:
      type: string
      enum: [FRAUD, FAKE_LISTING, MISLEADING_PRICE, NON_EXISTENT, SUSPICIOUS_SELLER, FORBIDDEN_CONTENT, OTHER]

    PaymentStatus:
      type: string
      enum: [PENDING, COMPLETED, FAILED, REFUNDED]

    BoostStatus:
      type: string
      enum: [ACTIVE, EXPIRED, CANCELLED]

    # ── Pagination ──
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 250
        totalPages:
          type: integer
          example: 13

    # ── Auth ──
    RegisterRequest:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
          minLength: 2
          maxLength: 50
          example: "Jean"
        lastName:
          type: string
          minLength: 2
          maxLength: 50
          example: "Rakoto"
        email:
          type: string
          format: email
          example: "jean@example.com"
        phone:
          type: string
          example: "+261340000000"
        password:
          type: string
          minLength: 8
          example: "SecureP@ss123"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
        refreshToken:
          type: string

    TokenRefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    # ── User ──
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        avatar:
          type: string
          nullable: true
        isPhoneVerified:
          type: boolean
        isEmailVerified:
          type: boolean
        isVerifiedSeller:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UserPublic:
      type: object
      description: Profil public (pas d'infos sensibles)
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        avatar:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        sellerProfile:
          $ref: '#/components/schemas/SellerProfile'
        averageRating:
          type: number
          format: float
        totalSales:
          type: integer
        activeListingsCount:
          type: integer

    UserUpdateRequest:
      type: object
      properties:
        firstName:
          type: string
          minLength: 2
          maxLength: 50
        lastName:
          type: string
          minLength: 2
          maxLength: 50
        phone:
          type: string
        avatar:
          type: string

    # ── Seller Profile ──
    SellerProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/SellerType'
        businessName:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        logo:
          type: string
          nullable: true
        city:
          type: string
        district:
          type: string
          nullable: true

    # ── Brand / Model ──
    Brand:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        logo:
          type: string
          nullable: true
        modelsCount:
          type: integer

    MotorcycleModel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        brandId:
          type: string
          format: uuid
        name:
          type: string
        brand:
          $ref: '#/components/schemas/Brand'

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string

    PartCategory:
      type: object
      description: "Catégorie de pièce détachée"
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Freins"
        slug:
          type: string
          example: "freins"
        icon:
          type: string
          nullable: true

    AccessoryCategory:
      type: object
      description: "Catégorie d'accessoire"
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Casque"
        slug:
          type: string
          example: "casque"
        icon:
          type: string
          nullable: true

    # ── Annonce (Listing) ──
    Listing:
      type: object
      description: "Annonce unifiée (moto, pièce ou accessoire)"
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ListingType'
        sellerId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        price:
          type: integer
          description: "Prix en Ariary (MGA)"
        isPriceNegotiable:
          type: boolean
        condition:
          $ref: '#/components/schemas/ConditionType'
        city:
          type: string
        district:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ListingStatus'
        isFeatured:
          type: boolean
        publishedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        viewsCount:
          type: integer
        images:
          type: array
          items:
            $ref: '#/components/schemas/ListingImage'
        seller:
          $ref: '#/components/schemas/SellerSummary'
        # Champs spécifiques MOTO
        brand:
          $ref: '#/components/schemas/Brand'
          nullable: true
        model:
          $ref: '#/components/schemas/MotorcycleModel'
          nullable: true
        motorcycleCategory:
          $ref: '#/components/schemas/MotorcycleCategory'
          nullable: true
        year:
          type: integer
          nullable: true
        mileage:
          type: integer
          nullable: true
        engineCc:
          type: integer
          nullable: true
        fuel:
          $ref: '#/components/schemas/FuelType'
          nullable: true
        transmission:
          $ref: '#/components/schemas/TransmissionType'
          nullable: true
        maintenanceInfo:
          type: string
          nullable: true
        papersInfo:
          type: string
          nullable: true
        modifications:
          type: string
          nullable: true
        # Champs spécifiques PIÈCE
        partCategory:
          $ref: '#/components/schemas/PartCategory'
          nullable: true
        compatibleBrands:
          type: string
          nullable: true
        partReference:
          type: string
          nullable: true
        # Champs spécifiques ACCESSOIRE
        accessoryCategory:
          $ref: '#/components/schemas/AccessoryCategory'
          nullable: true
        accessorySize:
          type: string
          nullable: true
        accessoryColor:
          type: string
          nullable: true
        accessoryBrand:
          type: string
          nullable: true
        favoritesCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ListingSummary:
      type: object
      description: "Version allégée pour les listes"
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ListingType'
        title:
          type: string
        price:
          type: integer
        condition:
          $ref: '#/components/schemas/ConditionType'
        city:
          type: string
        status:
          $ref: '#/components/schemas/ListingStatus'
        isFeatured:
          type: boolean
        primaryImage:
          $ref: '#/components/schemas/ListingImage'
        seller:
          $ref: '#/components/schemas/SellerSummary'
        # Motos
        brand:
          $ref: '#/components/schemas/Brand'
          nullable: true
        model:
          $ref: '#/components/schemas/MotorcycleModel'
          nullable: true
        year:
          type: integer
          nullable: true
        mileage:
          type: integer
          nullable: true
        engineCc:
          type: integer
          nullable: true
        # Pièces
        partCategory:
          $ref: '#/components/schemas/PartCategory'
          nullable: true
        # Accessoires
        accessoryCategory:
          $ref: '#/components/schemas/AccessoryCategory'
          nullable: true
        createdAt:
          type: string
          format: date-time

    ListingCreateRequest:
      type: object
      required: [type, title, description, price, condition, city]
      properties:
        type:
          $ref: '#/components/schemas/ListingType'
        title:
          type: string
          minLength: 5
          maxLength: 100
        description:
          type: string
          minLength: 20
          maxLength: 5000
        price:
          type: integer
          minimum: 0
        isPriceNegotiable:
          type: boolean
          default: false
        condition:
          $ref: '#/components/schemas/ConditionType'
        city:
          type: string
        district:
          type: string
          nullable: true
        # Motos
        brandId:
          type: string
          format: uuid
        modelId:
          type: string
          format: uuid
        motorcycleCategory:
          $ref: '#/components/schemas/MotorcycleCategory'
        year:
          type: integer
          minimum: 1950
          maximum: 2030
        mileage:
          type: integer
          minimum: 0
        engineCc:
          type: integer
          minimum: 50
          maximum: 2000
        fuel:
          $ref: '#/components/schemas/FuelType'
        transmission:
          $ref: '#/components/schemas/TransmissionType'
        maintenanceInfo:
          type: string
          nullable: true
        papersInfo:
          type: string
          nullable: true
        modifications:
          type: string
          nullable: true
        # Pièces
        partCategoryId:
          type: string
          format: uuid
        compatibleBrands:
          type: string
        partReference:
          type: string
        # Accessoires
        accessoryCategoryId:
          type: string
          format: uuid
        accessorySize:
          type: string
        accessoryColor:
          type: string
        accessoryBrand:
          type: string

    ListingUpdateRequest:
      type: object
      description: "Tous les champs sont optionnels"
      properties:
        type:
          $ref: '#/components/schemas/ListingType'
        title:
          type: string
          minLength: 5
          maxLength: 100
        description:
          type: string
          minLength: 20
          maxLength: 5000
        price:
          type: integer
          minimum: 0
        isPriceNegotiable:
          type: boolean
        condition:
          $ref: '#/components/schemas/ConditionType'
        city:
          type: string
        district:
          type: string
        brandId:
          type: string
          format: uuid
        modelId:
          type: string
          format: uuid
        motorcycleCategory:
          $ref: '#/components/schemas/MotorcycleCategory'
        year:
          type: integer
        mileage:
          type: integer
        engineCc:
          type: integer
        fuel:
          $ref: '#/components/schemas/FuelType'
        transmission:
          $ref: '#/components/schemas/TransmissionType'
        partCategoryId:
          type: string
          format: uuid
        compatibleBrands:
          type: string
        partReference:
          type: string
        accessoryCategoryId:
          type: string
          format: uuid
        accessorySize:
          type: string
        accessoryColor:
          type: string
        accessoryBrand:
          type: string
        favoritesCount:
          type: integer
        viewsCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SellerSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        avatar:
          type: string
          nullable: true
        isVerifiedSeller:
          type: boolean
        sellerType:
          $ref: '#/components/schemas/SellerType'
        businessName:
          type: string
          nullable: true
        averageRating:
          type: number
          format: float

    StatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/ListingStatus'

    # ── Images ──
    ListingImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        position:
          type: integer
        isPrimary:
          type: boolean

    ImageUploadResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        position:
          type: integer
        isPrimary:
          type: boolean

    # ── Favorites ──
    Favorite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        listingId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        listing:
          $ref: '#/components/schemas/ListingSummary'

    # ── Conversations / Messages ──
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        listingId:
          type: string
          format: uuid
        buyerId:
          type: string
          format: uuid
        sellerId:
          type: string
          format: uuid
        listing:
          $ref: '#/components/schemas/ListingSummary'
        lastMessage:
          $ref: '#/components/schemas/Message'
        unreadCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ConversationCreateRequest:
      type: object
      required: [listingId, sellerId, content]
      properties:
        listingId:
          type: string
          format: uuid
        sellerId:
          type: string
          format: uuid
        content:
          type: string
          minLength: 1
          maxLength: 2000

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        content:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
          format: date-time

    MessageSendRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000

    # ── Reviews ──
    Review:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reviewerId:
          type: string
          format: uuid
        sellerId:
          type: string
          format: uuid
        listingId:
          type: string
          format: uuid
          nullable: true
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, HIDDEN, DELETED]
        reviewer:
          $ref: '#/components/schemas/UserPublic'
        createdAt:
          type: string
          format: date-time

    ReviewCreateRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
          nullable: true
        listingId:
          type: string
          format: uuid
          description: "ID de l'annonce concernée par la transaction"

    # ── Reports ──
    Report:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reporterId:
          type: string
          format: uuid
        listingId:
          type: string
          format: uuid
        reason:
          $ref: '#/components/schemas/ReportReason'
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, REVIEWED, RESOLVED, DISMISSED]
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true

    ReportCreateRequest:
      type: object
      required: [listingId, reason]
      properties:
        listingId:
          type: string
          format: uuid
        reason:
          $ref: '#/components/schemas/ReportReason'
        description:
          type: string
          maxLength: 2000
          nullable: true

    # ── Payments ──
    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          type: string
          enum: [BOOST, SUBSCRIPTION]
        amount:
          type: integer
        currency:
          type: string
          example: "MGA"
        provider:
          type: string
        providerReference:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/PaymentStatus'
        createdAt:
          type: string
          format: date-time

    PaymentCreateRequest:
      type: object
      required: [type, amount]
      properties:
        type:
          type: string
          enum: [BOOST, SUBSCRIPTION]
        amount:
          type: integer
          minimum: 1
        currency:
          type: string
          default: "MGA"
        provider:
          type: string
          example: "orange_money"
        metadata:
          type: object
          description: "Données supplémentaires (planId, boostPlanId, etc.)"
          additionalProperties: true

    WebhookRequest:
      type: object
      description: "Payload du provider de paiement (adapté par provider)"
      properties:
        event:
          type: string
        data:
          type: object
          additionalProperties: true

    # ── Boost ──
    BoostPlan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        durationDays:
          type: integer
        price:
          type: integer
        isActive:
          type: boolean

    Boost:
      type: object
      properties:
        id:
          type: string
          format: uuid
        listingId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        plan:
          $ref: '#/components/schemas/BoostPlan'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/BoostStatus'

    # ── Subscriptions ──
    SubscriptionPlan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price:
          type: integer
        durationDays:
          type: integer
        maxActiveListings:
          type: integer
        maxBoosts:
          type: integer
        features:
          type: array
          items:
            type: string
        isActive:
          type: boolean

    Subscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        plan:
          $ref: '#/components/schemas/SubscriptionPlan'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [ACTIVE, EXPIRED, CANCELLED]

    # ── Admin ──
    AdminDashboard:
      type: object
      properties:
        totalUsers:
          type: integer
        activeListings:
          type: integer
        soldListings:
          type: integer
        pendingReports:
          type: integer
        totalRevenue:
          type: integer
        newUsersThisMonth:
          type: integer
        newListingsThisMonth:
          type: integer

    AdminUserList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    # ── Errors ──
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    # ── Success ──
    SuccessResponse:
      type: object
      properties:
        message:
          type: string

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SortParam:
      name: sort
      in: query
      schema:
        type: string
        enum: [relevance, newest, price_asc, price_desc, mileage_asc, year_desc]
        default: relevance

paths:
  # ═══════════════════════════════════════════════
  # AUTH
  # ═══════════════════════════════════════════════
  /auth/register:
    post:
      tags: [Auth]
      summary: Créer un compte
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Compte créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Données invalides
          content:
