# ═══════════════════════════════════════════════════════════════════════
# MotoMarket - Déploiement Backend sur Render (tier gratuit)
# ═══════════════════════════════════════════════════════════════════════
# Usage : importer ce fichier dans le dashboard Render (New > Blueprint),
# ou coller son contenu dans l'onglet "Env" du service.
#
# Variables requises à définir dans le dashboard Render :
#   DATABASE_URL         URL PostgreSQL (Neon ou Supabase), ex :
#                        postgresql://user:pass@host/db?sslmode=require
#                        (Neon : utiliser la connexion "pooled" pour l'exécution)
#   DIRECT_URL           URL PostgreSQL directe (SANS "-pooler") utilisée par
#                        `prisma migrate deploy` pour créer/appliquer les migrations
#   CORS_ORIGIN          https://<ton-app>.vercel.app
#   JWT_SECRET           chaîne longue et aléatoire
#   JWT_REFRESH_SECRET   chaîne longue et aléatoire
#   AWS_ENDPOINT_URL_S3  endpoint S3 (Neon Object Storage / Cloudflare R2 / B2)
#   AWS_REGION           région du bucket
#   AWS_ACCESS_KEY_ID    clé d'accès S3
#   AWS_SECRET_ACCESS_KEY clé secrète S3
#   STORAGE_BUCKET       nom du bucket (ex: assets)
#
# Optionnelles :
#   PORT                 (fourni automatiquement par Render)
#   NODE_ENV             production
#   PAYMENT_API_KEY      / PAYMENT_SECRET
# ═══════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: motomarket-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend

    buildCommand: npm install && npm run build && npx prisma generate

    startCommand: npx prisma migrate deploy && node dist/server.js

    # Health check : Render considère le service "live" quand /api/health répond
    healthCheckPath: /api/health

    # Le disque est éphémère : déclarer ici uniquement si besoin d'un espace
    # persistant (conseillé : utiliser un bucket S3 pour les uploads).
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://motomarket.vercel.app
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: STORAGE_BUCKET
        value: assets
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        value: eu-central-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false